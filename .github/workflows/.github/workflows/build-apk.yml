name: Build FreshCart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create freshcart
          cp main.dart freshcart/lib/main.dart
          cp pubspec.yaml freshcart/pubspec.yaml

      - name: Get dependencies and build APK
        run: |
          cd freshcart
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreshCart-APK
          path: freshcart/build/app/outputs/flutter-apk/app-release.apk
